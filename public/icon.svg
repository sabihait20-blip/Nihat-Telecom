<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Pink-Orange Glass Dark Theme) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180728"/>
      <stop offset="50%" stop-color="#2a0c3b"/>
      <stop offset="100%" stop-color="#12041d"/>
    </linearGradient>

    <!-- Pink-Rose Main Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Vivid Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Spheres in background -->
  <circle cx="100" cy="100" r="120" fill="#f43f5e" opacity="0.25" filter="url(#glow)"/>
  <circle cx="410" cy="410" r="140" fill="#f97316" opacity="0.2" filter="url(#glow)"/>

  <!-- Outer Glass Frame Ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#glassGrad)" stroke="url(#pinkGrad)" stroke-width="4" opacity="0.6"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" opacity="0.4"/>

  <!-- Shield Badge Outline -->
  <path d="M256 65 L385 125 V245 C385 338 325 412 256 442 C187 412 127 338 127 245 V125 Z" fill="#1b082c" fill-opacity="0.75" stroke="url(#pinkGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Signal Radio Waves Behind NBP -->
  <path d="M185 150 A95 95 0 0 1 327 150" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M205 180 A65 65 0 0 1 307 180" fill="none" stroke="url(#pinkGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Lightning Recharge Icon -->
  <path d="M272 122 L220 238 H276 L238 348 L316 222 H262 Z" fill="url(#orangeGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Prominent NBP Text -->
  <g font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="118" letter-spacing="-2">
    <!-- Shadow Effect -->
    <text x="259" y="294" fill="#090210" text-anchor="middle" opacity="0.85">NBP</text>
    <!-- Main Glowing Text -->
    <text x="256" y="290" fill="url(#goldGrad)" text-anchor="middle" stroke="#ffffff" stroke-width="2" filter="url(#glow)">NBP</text>
  </g>

  <!-- Digital Wallet Ribbon / Tag -->
  <rect x="105" y="365" width="302" height="48" rx="24" fill="url(#pinkGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="397" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">NIHAD BUSINESS POINT</text>

  <!-- Glowing Dot Accents -->
  <circle cx="256" cy="90" r="8" fill="#fb923c"/>
  <circle cx="140" cy="245" r="6" fill="#f43f5e"/>
  <circle cx="372" cy="245" r="6" fill="#f43f5e"/>
</svg>
