<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring Gradient Outer -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ring Gradient Inner -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Text Cyan/Magenta Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 0.95; transform: scale(1.02); }
    }

    @keyframes boltPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #fbbf24); }
    }

    @keyframes signalWave {
      0% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(0.85); }
    }

    .pulse-ring {
      transform-origin: 250px 250px;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .outer-ring {
      transform-origin: 250px 250px;
      animation: rotateClockwise 12s linear infinite;
    }

    .inner-ring {
      transform-origin: 250px 250px;
      animation: rotateCounterClockwise 16s linear infinite;
    }

    .bolt-icon {
      transform-origin: 250px 135px;
      animation: boltPulse 2s ease-in-out infinite;
    }

    .signal-arc {
      transform-origin: 250px 135px;
      animation: signalWave 2.5s ease-in-out infinite;
    }

    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #e2e8f0;
      font-size: 13px;
    }
  </style>

  <!-- Full Square Dark Background for PWA Icon Compatibility -->
  <rect width="500" height="500" fill="#020617" />

  <!-- Outer Dark Background Base Circle -->
  <circle cx="250" cy="250" r="240" fill="#020617" />
  
  <!-- Glowing Background Layer -->
  <circle class="pulse-ring" cx="250" cy="250" r="220" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <!-- Outer Rotating Tech Ring (Recharge Flow) -->
  <g class="outer-ring">
    <circle cx="250" cy="250" r="210" fill="none" stroke="url(#ringGrad1)" stroke-width="5" stroke-dasharray="80 40 120 30" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="250" cy="250" r="220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 30 5 40" opacity="0.5" />
    <circle cx="250" cy="40" r="7" fill="#06b6d4" />
    <circle cx="460" cy="250" r="8" fill="#8b5cf6" />
    <circle cx="250" cy="460" r="6" fill="#3b82f6" />
    <circle cx="40" cy="250" r="7" fill="#06b6d4" />
  </g>

  <!-- Inner Counter-Rotating Financial Ring -->
  <g class="inner-ring">
    <circle cx="250" cy="250" r="185" fill="none" stroke="url(#ringGrad2)" stroke-width="4" stroke-dasharray="150 50 60 40" stroke-linecap="round" />
    <circle cx="250" cy="250" r="175" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.6" />
    <circle cx="250" cy="65" r="5" fill="#f43f5e" />
    <circle cx="435" cy="250" r="6" fill="#ec4899" />
    <circle cx="65" cy="250" r="5" fill="#f43f5e" />
  </g>

  <!-- Inner Circle Plate -->
  <circle cx="250" cy="250" r="155" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Wireless Signal Arcs -->
  <g class="signal-arc">
    <path d="M 215 130 A 40 40 0 0 1 285 130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 228 140 A 22 22 0 0 1 272 140" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Lightning Bolt (Fast Recharge Icon) -->
  <path class="bolt-icon" d="M 252 110 L 238 138 H 252 L 246 160 L 264 130 H 250 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- NBP Brand Text using Vector Paths -->
  <g filter="url(#glow)">
    <!-- Letter 'N' -->
    <path d="M 130 210 L 152 210 L 178 258 L 178 210 L 196 210 L 196 280 L 174 280 L 148 232 L 148 280 L 130 280 Z" fill="url(#textGrad)" />
    
    <!-- Letter 'B' -->
    <path d="M 210 210 L 244 210 C 258 210 267 217 267 227 C 267 234 262 240 254 243 C 264 246 270 253 270 263 C 270 274 259 280 244 280 L 210 280 Z M 229 224 L 229 238 L 242 238 C 247 238 250 235 250 231 C 250 227 247 224 242 224 Z M 229 252 L 229 266 L 243 266 C 248 266 252 263 252 259 C 252 255 248 252 243 252 Z" fill="url(#textGrad)" />
    
    <!-- Letter 'P' -->
    <path d="M 284 210 L 318 210 C 333 210 344 220 344 233 C 344 247 333 256 318 256 L 303 256 L 303 280 L 284 280 Z M 303 224 L 303 242 L 316 242 C 322 242 326 239 326 233 C 326 227 322 224 316 224 Z" fill="url(#textGrad)" />
  </g>

  <!-- Underline Accent Arc -->
  <path d="M 140 298 Q 250 318 360 298" fill="none" stroke="url(#ringGrad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Circular Curved Text Path & Static Text for SVG Renderers -->
  <path id="textPathTop" d="M 100 250 A 150 150 0 0 1 400 250" fill="none" stroke="none" />
  <text class="sub-text">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      RECHARGE &amp; FINANCIAL
    </textPath>
  </text>
  <text x="250" y="118" class="sub-text" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0" letter-spacing="2">RECHARGE &amp; FINANCIAL</text>

  <!-- Mobile Financial Icons -->
  <!-- Wallet Icon -->
  <g transform="translate(160, 318) scale(0.85)">
    <rect x="0" y="0" width="22" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 14 8 h 8 v 4 h -8 z" fill="#38bdf8" />
    <circle cx="17" cy="10" r="1" fill="#0f172a" />
  </g>

  <!-- Transfer Arrow Icon -->
  <g transform="translate(310, 318) scale(0.85)">
    <path d="M0 4 L12 4 L8 0 M12 4 L8 8" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16 12 L4 12 L8 8 M4 12 L8 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Tagline -->
  <text x="250" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fbbf24" letter-spacing="4" text-anchor="middle">
    Nihad Business Point
  </text>

  <!-- Sparkles -->
  <path d="M 130 180 L 132 185 L 137 187 L 132 189 L 130 194 L 128 189 L 123 187 L 128 185 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 370 180 L 372 185 L 377 187 L 372 189 L 370 194 L 368 189 L 363 187 L 368 185 Z" fill="#ec4899" opacity="0.8" />
</svg>
