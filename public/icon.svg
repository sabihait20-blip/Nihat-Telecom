<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Neon Magenta Glow -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Border Ring -->
  <rect x="14" y="14" width="484" height="484" rx="101" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.6"/>
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Decorative Shield / Badge Outline -->
  <path d="M256 60 L390 120 V250 C390 345 328 420 256 450 C184 420 122 345 122 250 V120 Z" fill="#0f172a" fill-opacity="0.6" stroke="url(#pinkGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Signal Waves Behind NBP -->
  <path d="M190 145 A90 90 0 0 1 322 145" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M210 175 A60 60 0 0 1 302 175" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Lightning Recharge Icon behind NBP -->
  <path d="M268 120 L220 230 H272 L236 340 L310 215 H258 Z" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Prominent NBP Logo Text -->
  <g font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="118" letter-spacing="-2">
    <!-- Shadow Effect -->
    <text x="259" y="294" fill="#020617" text-anchor="middle" opacity="0.8">NBP</text>
    <!-- Main Glowing Text -->
    <text x="256" y="290" fill="url(#goldGrad)" text-anchor="middle" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)">NBP</text>
  </g>

  <!-- Digital Wallet Ribbon / Tag -->
  <rect x="110" y="365" width="292" height="48" rx="24" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="397" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">NIHAD BUSINESS POINT</text>

  <!-- Glowing Dot Accents -->
  <circle cx="256" cy="88" r="8" fill="#38bdf8"/>
  <circle cx="138" cy="250" r="6" fill="#f59e0b"/>
  <circle cx="374" cy="250" r="6" fill="#f59e0b"/>
</svg>
