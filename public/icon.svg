<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Ring Gradient Outer -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ring Gradient Inner -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Text Vivid Cyan to Magenta Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Sharp Shadow Filter for Ultra HD Depth -->
    <filter id="sharpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* HD Vector Styles */
    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes boltPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .outer-ring {
      transform-origin: 250px 250px;
      animation: rotateClockwise 20s linear infinite;
    }

    .inner-ring {
      transform-origin: 250px 250px;
      animation: rotateCounterClockwise 25s linear infinite;
    }

    .bolt-icon {
      transform-origin: 250px 132px;
      animation: boltPulse 3s ease-in-out infinite;
    }

    .brand-title {
      font-family: system-ui, -apple-system, 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }

    .sub-text {
      font-family: system-ui, -apple-system, 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #38bdf8;
      font-size: 13px;
    }
  </style>

  <!-- Full Square Dark Background for PWA Icon Square/Maskable Compatibility -->
  <rect width="500" height="500" fill="#020617" />

  <!-- Outer Dark Background Base Circle with Crisp Border -->
  <circle cx="250" cy="250" r="240" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  
  <!-- Radial Glow Inner Layer (No Blurring Filter) -->
  <circle cx="250" cy="250" r="225" fill="url(#bgGrad)" stroke="#0284c7" stroke-width="2" opacity="0.9" />

  <!-- Outer Rotating Tech Ring (Sharp Lines) -->
  <g class="outer-ring">
    <circle cx="250" cy="250" r="210" fill="none" stroke="url(#ringGrad1)" stroke-width="6" stroke-dasharray="100 30 140 30" stroke-linecap="round" />
    <circle cx="250" cy="250" r="222" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 28 8 36" opacity="0.6" />
    <circle cx="250" cy="40" r="8" fill="#38bdf8" />
    <circle cx="460" cy="250" r="9" fill="#a855f7" />
    <circle cx="250" cy="460" r="7" fill="#3b82f6" />
    <circle cx="40" cy="250" r="8" fill="#06b6d4" />
  </g>

  <!-- Inner Counter-Rotating Financial Ring (Sharp Lines) -->
  <g class="inner-ring">
    <circle cx="250" cy="250" r="185" fill="none" stroke="url(#ringGrad2)" stroke-width="5" stroke-dasharray="160 40 70 30" stroke-linecap="round" />
    <circle cx="250" cy="250" r="174" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 12" opacity="0.7" />
    <circle cx="250" cy="65" r="6" fill="#f43f5e" />
    <circle cx="435" cy="250" r="7" fill="#ec4899" />
    <circle cx="65" cy="250" r="6" fill="#f43f5e" />
  </g>

  <!-- Inner Circle Plate (High Contrast Slate Center) -->
  <circle cx="250" cy="250" r="155" fill="#0f172a" stroke="#334155" stroke-width="4" filter="url(#sharpShadow)" />
  <circle cx="250" cy="250" r="148" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Wireless Signal Arcs (Top Center) -->
  <g>
    <path d="M 210 122 A 45 45 0 0 1 290 122" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 224 133 A 28 28 0 0 1 276 133" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Lightning Bolt (Fast Recharge Icon - Ultra HD Crisp Gold) -->
  <path class="bolt-icon" d="M 253 102 L 236 134 H 253 L 245 160 L 267 124 H 250 Z" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1" stroke-linejoin="round" filter="url(#sharpShadow)" />

  <!-- NBP Brand Text using Ultra Crisp Sharp Vector Paths -->
  <g filter="url(#sharpShadow)">
    <!-- Letter 'N' -->
    <path d="M 126 202 L 150 202 L 178 252 L 178 202 L 198 202 L 198 276 L 174 276 L 146 226 L 146 276 L 126 276 Z" fill="url(#textGrad)" stroke="#0284c7" stroke-width="1" />
    
    <!-- Letter 'B' -->
    <path d="M 210 202 L 246 202 C 262 202 272 210 272 221 C 272 229 266 235 257 238 C 268 241 275 249 275 260 C 275 272 263 276 L 210 276 Z M 231 217 L 231 232 L 244 232 C 250 232 253 229 253 224 C 253 219 250 217 244 217 Z M 231 246 L 231 261 L 246 261 C 252 261 256 258 256 253 C 256 248 252 246 246 246 Z" fill="url(#textGrad)" stroke="#a855f7" stroke-width="1" />
    
    <!-- Letter 'P' -->
    <path d="M 286 202 L 322 202 C 338 202 350 212 350 226 C 350 241 338 250 322 250 L 306 250 L 306 276 L 286 276 Z M 306 217 L 306 235 L 320 235 C 327 235 331 232 331 226 C 331 220 327 217 320 217 Z" fill="url(#textGrad)" stroke="#ec4899" stroke-width="1" />
  </g>

  <!-- Underline Accent Arc (High Contrast) -->
  <path d="M 135 292 Q 250 314 365 292" fill="none" stroke="url(#ringGrad1)" stroke-width="5" stroke-linecap="round" filter="url(#sharpShadow)" />

  <!-- Subtitle Text -->
  <text x="250" y="322" class="sub-text" text-anchor="middle" font-size="13" font-weight="900" fill="#38bdf8" letter-spacing="3" filter="url(#sharpShadow)">
    RECHARGE &amp; FINANCIAL
  </text>

  <!-- Mobile Financial Icons -->
  <g transform="translate(162, 336)" filter="url(#sharpShadow)">
    <rect x="0" y="0" width="24" height="17" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 15 8.5 h 9 v 4 h -9 z" fill="#38bdf8" />
    <circle cx="18" cy="10.5" r="1.2" fill="#0f172a" />
  </g>

  <g transform="translate(312, 336)" filter="url(#sharpShadow)">
    <path d="M0 5 L14 5 L9 0 M14 5 L9 10" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M18 13 L4 13 L9 8 M4 13 L9 18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Tagline (Ultra HD Gold Bold Text) -->
  <text x="250" y="375" class="brand-title" font-size="15" font-weight="900" fill="#fbbf24" letter-spacing="3" text-anchor="middle" filter="url(#sharpShadow)">
    Nihad Business Point
  </text>

  <!-- Sharp Star/Sparkle Accent Elements -->
  <path d="M 125 175 L 128 182 L 135 185 L 128 188 L 125 195 L 122 188 L 115 185 L 122 182 Z" fill="#38bdf8" />
  <path d="M 375 175 L 378 182 L 385 185 L 378 188 L 375 195 L 372 188 L 365 185 L 372 182 Z" fill="#f43f5e" />
</svg>
